name: Bug report
description: Report incorrect behavior or a crash
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please include enough detail to reproduce the issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from how you launched BookRunner.
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag (e.g. v0.2.0), package filename, or `git describe` from a source build.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Compositor / distro / Wayland session, and how you installed (source, .deb, AppImage, etc.).
      placeholder: |
        - Compositor: Hyprland 0.xx
        - Distro: CachyOS
        - Install: built from source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Terminal output, `WAYLAND_DEBUG=client` excerpt if relevant, or screenshots.
    validations:
      required: false
