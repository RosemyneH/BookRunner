name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            meson ninja-build pkg-config rpm file zstd wget curl \
            libwayland-dev wayland-protocols libwayland-cursor-dev \
            libcairo2-dev libpango1.0-dev libpangocairo1.0-dev \
            libgdk-pixbuf-2.0-dev libglib2.0-dev libsqlite3-dev libxkbcommon-dev \
            librsvg2-bin

      - name: Compute version
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and stage
        run: |
          meson setup build --prefix=/usr --buildtype=release -Dwerror=false
          meson compile -C build
          DESTDIR="${{ github.workspace }}/staging" meson install -C build

      - name: Install nfpm
        run: |
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz | tar xz -C /tmp nfpm
          sudo install -m755 /tmp/nfpm /usr/local/bin/nfpm

      - name: Build .deb and .rpm
        run: |
          mkdir -p dist
          sed "s/__VERSION__/${{ steps.ver.outputs.VERSION }}/g" packaging/nfpm.yaml > /tmp/nfpm.yaml
          nfpm package -f /tmp/nfpm.yaml -p deb --target dist/
          nfpm package -f /tmp/nfpm.yaml -p rpm --target dist/

      - name: Build AppImage
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euxo pipefail
          mkdir -p AppDir
          cp -a staging/usr AppDir/
          rsvg-convert -w 256 data/icons/hicolor/scalable/apps/bookrunner.svg -o bookrunner.png
          curl -sSfLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSfLO https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          curl -sSfLO https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage linuxdeploy-plugin-gtk-x86_64.AppImage
          export ARCH=x86_64
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e AppDir/usr/bin/bookrunner \
            -d data/bookrunner.desktop \
            -i bookrunner.png \
            --plugin gtk \
            --plugin appimage
          shopt -s nullglob
          out=""
          for f in ./*.AppImage ./BookRunner*.AppImage; do
            if [[ -f "$f" ]]; then out="$f"; break; fi
          done
          if [[ -z "${out}" ]]; then
            echo "linuxdeploy did not produce an AppImage" >&2
            ls -la
            exit 1
          fi
          mv "$out" "dist/bookrunner-${VERSION}-x86_64.AppImage"

      - name: Checksums
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS
          generate_release_notes: true
