name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            meson ninja-build pkg-config \
            libwayland-dev wayland-protocols \
            libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libglib2.0-dev libsqlite3-dev libxkbcommon-dev

      - name: Meson build
        run: |
          meson setup build --prefix=/usr -Dwerror=false
          meson compile -C build

      - name: Meson install (dry layout)
        run: |
          DESTDIR="${{ github.workspace }}/staging" meson install -C build
          test -x staging/usr/bin/bookrunner
          test -f staging/usr/share/applications/bookrunner.desktop

  release-snapshot:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Snapshot tag name
        id: snap
        run: |
          ver=$(python3 -c "import re; m=re.search(r\"version:\\s*'([^']+)'\", open('meson.build',encoding='utf-8').read()); print(m.group(1) if m else '0.0.0')")
          tag="snapshot-${ver}-ci.${GITHUB_RUN_ID}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Will create ${tag} at ${GITHUB_SHA}"

      - name: Create GitHub Release (and tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.snap.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Snapshot ${{ steps.snap.outputs.version }} (${{ github.run_id }})" \
            --prerelease \
            --generate-notes
